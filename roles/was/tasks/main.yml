- name: Java 17 설치
  ansible.builtin.dnf:
    name: java-17-openjdk-headless
    state: present

- name: jboss 그룹 생성
  ansible.builtin.group:
    name: jboss
    system: true

- name: jboss 실행 전용 계정 생성 (로그인 불가)
  ansible.builtin.user:
    name: jboss
    group: jboss
    system: true
    shell: /sbin/nologin
    create_home: false

- name: JBoss 압축 해제 (이미 있으면 건너뜀)
  ansible.builtin.unarchive:
    src: "{{ jboss_zip }}"
    dest: /opt
    owner: jboss
    group: jboss
    creates: "/opt/{{ jboss_dir }}"

- name: /opt/jboss 바로가기 생성
  ansible.builtin.file:
    src: "/opt/{{ jboss_dir }}"
    dest: /opt/jboss
    state: link

- name: systemd 서비스 등록
  ansible.builtin.template:
    src: jboss.service.j2
    dest: /etc/systemd/system/jboss.service
  notify: restart jboss

- name: 방화벽 8080 허용
  ansible.posix.firewalld:
    port: 8080/tcp
    permanent: true
    immediate: true
    state: enabled

- name: JBoss 실행 및 자동 시작
  ansible.builtin.systemd:
    name: jboss
    state: started
    enabled: true
    daemon_reload: true

- name: 테스트 앱 배포
  ansible.builtin.copy:
    src: app.war
    dest: /opt/jboss/standalone/deployments/app.war
    owner: jboss
    group: jboss
